# roku-monitor: a "Roku TV" output whose volume slider IS the TV's volume.
# Template; install.sh --volume fills in @ROKU_SINK@ and puts the result in
# ~/.config/pipewire/pipewire.conf.d/90-roku-monitor.conf (uninstall.sh removes it).
#
# Why: the HDMI audio sink has no hardware volume, so a slider on it only scales
# samples in software (and the TV keeps whatever volume it had). This virtual
# output does NOT attenuate: with monitor.channel-volumes=false its monitor
# ports carry the raw, pre-volume, pre-mute signal, which the relay below
# copies unchanged to the real HDMI sink. Its volume and mute are then just
# numbers, which the roku-monitor daemon mirrors to the TV over ECP.
#
# The relay streams are pinned (node.dont-fallback + node.linger) so that when
# the HDMI sink disappears - it does on every screen blank - they wait instead of
# falling back to the default output, which would be this very sink (a loop).
# WirePlumber re-links them when the HDMI sink comes back. Never use
# node.dont-reconnect here: WirePlumber destroys such a stream when its target
# goes away, and the relay would be dead after the first blank.
# channelmix.lock-volumes keeps a slider dragged on the relay (Settings > Sound >
# Volume Levels) from attenuating anything. priority.session=1000 beats the raw
# HDMI sink (~632) in WirePlumber's fallback ranking, not a headset (2010).
context.objects = [
  { factory = adapter
    flags = [ nofail ]
    args = {
      factory.name            = support.null-audio-sink
      node.name               = "roku-tv"
      node.description        = "Roku TV"
      media.class             = Audio/Sink
      audio.position          = [ FL FR ]
      device.icon_name        = video-display
      priority.session        = 1000
      monitor.channel-volumes = false
    }
  }
]
context.modules = [
  { name = libpipewire-module-loopback
    flags = [ nofail ]
    args = {
      node.description = "Roku TV relay"
      audio.position   = [ FL FR ]
      capture.props = {
        node.name               = "roku-tv-relay.capture"
        target.object           = "roku-tv"
        stream.capture.sink     = true
        node.passive            = true
        node.dont-fallback      = true
        node.linger             = true
        node.dont-move          = true
        channelmix.lock-volumes = true
      }
      playback.props = {
        node.name               = "roku-tv-relay.playback"
        target.object           = "@ROKU_SINK@"
        node.passive            = true
        stream.dont-remix       = true
        node.dont-fallback      = true
        node.linger             = true
        node.dont-move          = true
        channelmix.lock-volumes = true
      }
    }
  }
]
